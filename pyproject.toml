[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-intelligence-data-pipeline"
version = "0.1.0"
description = "A Python pipeline for collecting, validating, normalizing, and reporting public company data from SEC EDGAR APIs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1,<4",
    "pandas>=3.0,<4",
    "python-dotenv>=1.2,<2",
    "requests>=2.34,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]